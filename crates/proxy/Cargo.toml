[package]
name = "unitylan-proxy"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "unitylan_proxy"
path = "src/lib.rs"

[dependencies]
unitylan-common.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Same local-socket transport the GUI uses, so both frontends speak to the engine identically.
interprocess = { version = "2.4.2", features = ["tokio"] }
# TLS termination. `ring` to match the rest of the tree (the engine's ACME client and the
# coordinator both build rustls on ring), so one crypto provider ships in the binaries.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls-pemfile = "2"
# HTTP in both directions: serve the mesh side, forward to a loopback backend.
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"

# `unitylan-common` is imported as `common` (its [lib] name), which cargo-machete's source scan
# doesn't follow — it reports the crate as unused. It isn't.
[package.metadata.cargo-machete]
ignored = ["unitylan-common"]
