[package]
name = "unitylan-common"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Test-only helpers (`common::testutil`), pulled in by the other crates' dev-dependencies. Gated so
# nothing test-shaped rides along into a release build; with resolver 2 a dev-dependency's features
# aren't unified into `cargo build`, so this stays out of the shipped binaries.
testutil = []

[lib]
name = "common"
path = "src/lib.rs"

[dependencies]
serde.workspace = true
postcard.workspace = true
thiserror.workspace = true

ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = "0.22"
ipnet = { version = "2", features = ["serde"] }
siphasher = "1"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"

[dev-dependencies]
serde_json.workspace = true
