[package]
name = "unitylan-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "unitylan-engine"
path = "src/main.rs"

[features]
# Test-only: accept an invalid/self-signed TLS cert when downloading an update artifact. The update
# client trusts only the compiled-in webpki roots, so an offline e2e test (scripts/update-test.sh)
# can't otherwise serve the artifact over the mandatory HTTPS from a local host. NEVER enable in a
# shipped build — it disables certificate validation on the update channel. Default off.
test-insecure-tls = []

[dependencies]
unitylan-common.workspace = true
unitylan-proxy.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
tokio.workspace = true
toml.workspace = true

clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
defguard_wireguard_rs = "0.10.0"
igd-next = { version = "0.17", features = ["aio_tokio"] }
interprocess = { version = "2.4.2", features = ["tokio"] }
base64 = "0.22"
sha2 = "0.10"
hickory-proto = "0.26.1"
turn = "0.17"
webrtc-util = "0.17"
webrtc-ice = "0.17"
async-trait = "0.1"
surge-ping = "0.8"
futures = "0.3"
semver = "1"
ipnet = "2"
if-addrs = "0.13"
# In-place swap of the running engine binary on a file-swap auto-update — same crate, both platforms
# (Windows can also fall back to an MSI artifact, applied via msiexec).
self-replace = "1"
# Unpack the auto-update bundle: a .tar.gz carrying the engine + GUI together so both are replaced in
# lockstep (the engine and GUI speak an unversioned control protocol). Both Linux and Windows use it.
tar = "0.4"
flate2 = "1"
# ACME (DNS-01) for publicly-trusted certificates on mesh names. `ring` rather than the default
# `aws-lc-rs`: that backend builds a C library (`aws-lc-sys`) the Windows cross-build does not want,
# and the rest of the tree is already rustls-on-ring. The `rcgen` feature is what provides
# `Order::finalize`, which mints the keypair and CSR locally — the private key is generated on the
# device and never leaves it.
instant-acme = { version = "0.8.5", default-features = false, features = [
    "ring",
    "hyper-rustls",
    "rcgen",
] }
# Read `notAfter` off the issued certificate, so renewal is driven by what the CA actually granted
# rather than by assuming its lifetime. Already in the tree via instant-acme's rcgen.
x509-parser = "0.18.1"

[target.'cfg(unix)'.dependencies]
# Resolve `control_group` (name → gid) to own the control socket root:<group>.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-service = "0.7"
# Build the control-pipe DACL as an SDDL wide-string (see control/server.rs). Version-matched to
# interprocess's own widestring so `SecurityDescriptor::deserialize`'s `&U16CStr` type unifies.
widestring = "1"
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
unitylan-common = { workspace = true, features = ["testutil"] }

# `unitylan-common` is imported as `common` (its [lib] name), which cargo-machete's source scan
# doesn't follow — it reports the crate as unused. It isn't.
[package.metadata.cargo-machete]
ignored = ["unitylan-common"]
