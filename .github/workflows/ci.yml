name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      # The doc comments carry this project's design record, and they cross-reference each other
      # heavily. Without a gate, a rename silently turns `[`Foo`]` into plain text and the rot is
      # invisible until someone reads the generated docs.
      - name: doc
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # Dev happens mostly on Linux, so the Windows-only modules (wg/fw/resolver/windows.rs,
  # service.rs) never compile in the `check` job. Build + test them here so drift surfaces on
  # every PR instead of only at release time. The coordinator is a Linux-only server binary — it
  # never ships to Windows, so exclude it rather than impose a Windows-compile constraint on it.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy
        run: cargo clippy --workspace --exclude unitylan-coordinator --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace --exclude unitylan-coordinator

  # Dependency-vulnerability gate. Reads the ignore-list in .cargo/audit.toml (triaged, non-
  # applicable advisories, all in the GUI's transitive deps) and fails on any new advisory in the
  # engine/coordinator trees.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit
        run: cargo audit

  # `rust-version` in Cargo.toml is a promise to anyone building from source (distro packagers,
  # people on an older toolchain). The other jobs run on `stable`, which satisfies it trivially and
  # would keep satisfying it as stable moves on — so the promise is only worth something if one job
  # actually builds on the declared floor. `check` rather than `test`: this is about the code
  # compiling on 1.96, and the test run is already covered above.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96
      - uses: Swatinem/rust-cache@v2
      - name: cargo check on the declared MSRV
        run: cargo check --workspace --all-targets

  # Dependency policy that isn't about vulnerabilities: licences we can distribute inside an AGPL
  # binary, no dependency arriving from anywhere but crates.io, no unused entries in a manifest.
  # Policy and its reasoning live in deny.toml; advisories stay with `cargo audit` above so there
  # is only one ignore-list to maintain.
  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-machete
      - name: cargo deny
        run: cargo deny check licenses bans sources
      - name: cargo machete
        run: cargo machete
