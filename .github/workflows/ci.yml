name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      # The doc comments carry this project's design record, and they cross-reference each other
      # heavily. Without a gate, a rename silently turns `[`Foo`]` into plain text and the rot is
      # invisible until someone reads the generated docs.
      - name: doc
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # Dev happens mostly on Linux, so the Windows-only modules (wg/fw/resolver/windows.rs,
  # service.rs) never compile in the `check` job. Build + test them here so drift surfaces on
  # every PR instead of only at release time. The coordinator is a Linux-only server binary — it
  # never ships to Windows, so exclude it rather than impose a Windows-compile constraint on it.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy
        run: cargo clippy --workspace --exclude unitylan-coordinator --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace --exclude unitylan-coordinator

  # Seeds the cache the tag-triggered release build restores from. Actions caches are scoped to the
  # run's ref, and a tag run (`refs/tags/vX.Y.Z`) can read only its own scope plus the default
  # branch — sibling tags are invisible to each other. So release.yml could never warm itself, and
  # every release rebuilt the world from cold. This job writes under main's scope, which every run
  # can read, using the `release` shared-key both release jobs restore.
  #
  # It must build `--release`: the other jobs here are debug, and cargo shares nothing across
  # profiles (different target dir, profile feeds `-C metadata`). Same crate set as
  # packaging/build.sh and packaging/windows/build.ps1, so the tag build finds its dependencies
  # already compiled.
  #
  # Push-only: a PR's cache lands in `refs/pull/N/merge`, which no release can read.
  warm-release-cache:
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      # Matched to release.yml so `common`'s baked-in pubkey is already compiled the right way.
      UNITYLAN_RELEASE_PUBKEY: ${{ vars.UNITYLAN_RELEASE_PUBKEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
      - run: cargo build --release -p unitylan-engine -p unitylan-gui

  # Dependency-vulnerability gate. Reads the ignore-list in .cargo/audit.toml (triaged, non-
  # applicable advisories, all in the GUI's transitive deps) and fails on any new advisory in the
  # engine/coordinator trees.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit
        run: cargo audit

  # `rust-version` in Cargo.toml is a promise to anyone building from source (distro packagers,
  # people on an older toolchain). The other jobs run on `stable`, which satisfies it trivially and
  # would keep satisfying it as stable moves on — so the promise is only worth something if one job
  # actually builds on the declared floor. `check` rather than `test`: this is about the code
  # compiling on 1.96, and the test run is already covered above.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96
      - uses: Swatinem/rust-cache@v2
      - name: cargo check on the declared MSRV
        run: cargo check --workspace --all-targets

  # Dependency policy that isn't about vulnerabilities: licences we can distribute inside an AGPL
  # binary, no dependency arriving from anywhere but crates.io, no unused entries in a manifest.
  # Policy and its reasoning live in deny.toml; advisories stay with `cargo audit` above so there
  # is only one ignore-list to maintain.
  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-machete
      - name: cargo deny
        run: cargo deny check licenses bans sources
      - name: cargo machete
        run: cargo machete
