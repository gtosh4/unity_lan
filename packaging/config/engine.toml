# UnityLAN engine config (installed at /etc/unitylan/engine.toml).
# Edit `coordinator` and `enrollment_key`, then: systemctl enable --now unitylan-engine

# Coordinator base URL. Defaults to the hosted instance; point at your own to self-host.
coordinator = "https://coordinator.unitylan.com"

# Managed by the systemd unit (StateDirectory / RuntimeDirectory). Leave these as-is.
state_dir = "/var/lib/unitylan"
control_socket = "/run/unitylan/control.sock"
# The control socket is owned root:unitylan mode 660; add your desktop user to the `unitylan` group
# (`sudo usermod -aG unitylan <you>`, then re-login) so the GUI/CLI can drive the engine without root.
control_group = "unitylan"

# One-time enrollment key that binds this device to its owner on first register.
# enrollment_key = "..."

# Device name (the <device> DNS label). Defaults to the system hostname.
# device_name = "my-host"

# --- mesh ---
# iface = "unl0"
# listen_port = 51820
# endpoint = "203.0.113.5:51820"   # set for a manual port-forward; disables UPnP
# upnp = true

# --- DNS ---
# The `.unity.internal` resolver (name resolution for `<device>.<user>.unity.internal`) listens on
# this device's own mesh IP, port 53. On by default; set false to reach peers by IP.
# dns = false
# resolver_hook routes `.internal` at the OS resolver (systemd-resolved today; the backend is
# chosen at runtime, so no reinstall is needed if you switch resolvers). On by default.
# resolver_hook = true

# --- firewall (default-deny inbound on the wg iface; secure by default) ---
# firewall = true
# expose = [ { port = 25565, proto = "tcp" } ]
# A named service is an exposed port people can remember — `mc.<you>.unity.internal`. Add `web = true`
# for something a browser opens, and it goes into this device's HTTPS certificate too.
# expose = [ { port = 25565, proto = "tcp", name = "mc" }, { port = 8096, name = "jellyfin", web = true } ]

# --- HTTPS for web services ---
# The proxy terminates TLS for `web` services and forwards to them over plain HTTP on loopback, so
# the app itself needs no certificate configuration. It runs as its own unprivileged account, which
# the package creates; the engine refuses to start it as root, so leave `user` set.
[proxy]
user = "unitylan-proxy"
# enabled = false   # ...or turn it off and serve TLS yourself (nginx, Caddy) from the paths below.

[cert]
# The group that may read the certificate's private key. The proxy's own group, so it can serve it;
# change this if something else terminates TLS instead.
group = "unitylan-proxy"
# reload_command = ["systemctl", "reload", "nginx"]   # run after each renewal, if you serve it yourself
